name: Update Pi with nix-update

on:
  schedule:
    # Every 6 hours
    - cron: "15 */6 * * *"
  # Packaging changes (module updates, build fixes) shift node_modules
  # hashes without an upstream version bump. Push runs force the platform
  # hash refresh and tag v<version>-nix<N> when hashes actually changed.
  push:
    paths:
      - package.nix
  workflow_dispatch:
    inputs:
      force:
        description: "Run platform hash refresh even when there is no version bump"
        type: boolean
        default: false
      release-suffix:
        description: "Tag suffix for force-run releases (default: auto nix<N>)"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  # Slim probe: no Nix install. Returns fast when there is nothing to do.
  check:
    runs-on: ubuntu-latest
    outputs:
      should-run: ${{ steps.decide.outputs.should-run }}
      current-version: ${{ steps.decide.outputs.current-version }}
      latest-version: ${{ steps.decide.outputs.latest-version }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: package.nix
          sparse-checkout-cone-mode: false

      - name: Compare current vs upstream version
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT=$(grep -o 'version = "[^"]*"' package.nix | head -1 | sed 's/version = "\(.*\)"/\1/')
          LATEST=$(gh api repos/earendil-works/pi/releases/latest --jq .tag_name | sed 's/^v//')
          echo "Current: $CURRENT"
          echo "Latest:  $LATEST"

          echo "current-version=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "latest-version=$LATEST" >> "$GITHUB_OUTPUT"

          FORCE="${{ inputs.force }}"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            FORCE=true
          fi

          if [ "$CURRENT" != "$LATEST" ] || [ "$FORCE" = "true" ]; then
            echo "should-run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should-run=false" >> "$GITHUB_OUTPUT"
          fi

  # Bump version + src hash once, authoritatively. Per-platform node_modules
  # hashes are deferred to the matrix.
  prepare:
    needs: check
    if: needs.check.outputs.should-run == 'true'
    runs-on: ubuntu-latest
    outputs:
      version-changed: ${{ steps.bump.outputs.version-changed }}
      new-version: ${{ steps.bump.outputs.new-version }}
    steps:
      - uses: actions/checkout@v5

      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - name: Install nix-update
        run: nix profile install github:Mic92/nix-update

      - name: Bump version + src hash
        id: bump
        env:
          NEW_VERSION_PLACEHOLDER: ""
        run: |
          # nix-update can't update per-platform outputHash maps, so it only
          # touches version + src.hash here. node_modules hashes are handled
          # by the platform-hashes matrix.
          nix-update --flake pi

          # nix-update doesn't know about our custom version-dependent fetchurl,
          # so re-hash it for the (possibly new) version.
          NEW_VERSION=$(grep -o 'version = "[^"]*"' package.nix | head -1 | sed 's/version = "\(.*\)"/\1/')
          AI_HASH=$(nix store prefetch-file --hash-type sha256 --json \
            "https://registry.npmjs.org/@earendil-works/pi-ai/-/pi-ai-${NEW_VERSION}.tgz" | jq -r .hash)
          sed -i '/pi-ai-.*\.tgz";/{N; s|hash = "sha256-[^"]*"|hash = "'"${AI_HASH}"'"|;}' package.nix
          grep -A1 'pi-ai-' package.nix | head -2

          if git diff --quiet; then
            VERSION_CHANGED=false
            echo "Version unchanged (force-only run)"
          else
            VERSION_CHANGED=true
            echo "Version bumped"
          fi

          echo "version-changed=$VERSION_CHANGED" >> "$GITHUB_OUTPUT"
          echo "new-version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload bumped package.nix
        uses: actions/upload-artifact@v5
        with:
          name: bumped-package-nix
          path: package.nix

  # Fan out: each platform builds on a native runner and reports its
  # node_modules hash. No sed here — the release job applies them all on
  # one runner (GNU sed), avoiding the BSD-vs-GNU divergence.
  platform-hashes:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: x86_64-linux,    runner: ubuntu-latest    }
          - { platform: aarch64-darwin,  runner: macos-latest     }
          - { platform: aarch64-linux,   runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - name: Pull bumped package.nix (overwrites checkout copy)
        uses: actions/download-artifact@v5
        with:
          name: bumped-package-nix

      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - name: Capture node_modules hash for ${{ matrix.platform }}
        run: |
          BUILD_LOG=$(nix build .#pi -L 2>&1) && BUILD_OK=true || BUILD_OK=false

          if [ "$BUILD_OK" = "true" ]; then
            echo "Build succeeded with existing hash; no update needed."
            : > hash.txt
          else
            # Only capture the node_modules FOD mismatch — a fetchurl failure
            # elsewhere would otherwise be mistaken for the node_modules hash.
            HASH=$(echo "$BUILD_LOG" | awk '
              /fixed-output derivation .*-pi-node_modules-[0-9.]+\.drv/ { grab = 1 }
              grab && /got:/ { sub(/.*got:[ ]*/, ""); print; exit }')
            if [ -z "$HASH" ]; then
              echo "Build failed for a non-hash reason:"
              echo "$BUILD_LOG"
              exit 1
            fi
            echo "Captured ${{ matrix.platform }} hash: $HASH"
            echo "$HASH" > hash.txt
          fi

      - uses: actions/upload-artifact@v5
        with:
          name: hash-${{ matrix.platform }}
          path: hash.txt

  # Apply hashes, commit, conditionally tag + GH release.
  # Policy:
  #   - Version bump: strict. Any platform job failure fails the release.
  #   - Force-only refresh: lenient. Apply whatever hashes came back.
  release:
    needs: [check, prepare, platform-hashes]
    if: |
      always() &&
      needs.check.outputs.should-run == 'true' &&
      needs.prepare.result == 'success' &&
      (needs.platform-hashes.result == 'success' ||
       (needs.platform-hashes.result == 'failure' && needs.prepare.outputs.version-changed == 'false'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Sync with remote (avoid push races)
        run: git pull --rebase origin main

      - name: Pull bumped package.nix
        uses: actions/download-artifact@v5
        with:
          name: bumped-package-nix

      - name: Pull all platform hashes
        uses: actions/download-artifact@v5
        with:
          pattern: hash-*
          path: hashes

      - name: Apply per-platform hashes to package.nix
        run: |
          for d in hashes/hash-*; do
            platform="${d#hashes/hash-}"
            hash=$(cat "$d/hash.txt" 2>/dev/null || true)
            if [ -n "$hash" ]; then
              echo "Updating $platform = $hash"
              sed -i "s|\"$platform\" = [^;]*|\"$platform\" = \"$hash\"|" package.nix
            else
              echo "$platform: already current, skipping"
            fi
          done

      - name: Update VERSION + README badge (version bump only)
        if: needs.prepare.outputs.version-changed == 'true'
        run: |
          echo "${{ needs.prepare.outputs.new-version }}" > VERSION
          sed -i "s/pi--v[0-9]*\.[0-9]*\.[0-9]*/pi--v${{ needs.prepare.outputs.new-version }}/g" README.md

      - name: Commit and push
        id: commit
        env:
          RELEASE_SUFFIX: ${{ inputs.release-suffix }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --staged --quiet; then
            echo "Nothing to commit (all hashes already current)"
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ needs.prepare.outputs.version-changed }}" = "true" ]; then
            TAG="v${{ needs.prepare.outputs.new-version }}"
            git commit -m "update pi to v${{ needs.prepare.outputs.new-version }} [skip ci]"
          else
            VERSION=$(grep -o 'version = "[^"]*"' package.nix | head -1 | sed 's/version = "\(.*\)"/\1/')
            if [ -n "$RELEASE_SUFFIX" ]; then
              TAG="v${VERSION}-${RELEASE_SUFFIX}"
            else
              N=$(git tag -l "v${VERSION}-nix*" | sed 's/.*-nix//' | sort -n | tail -1)
              N=$((N + 1))
              TAG="v${VERSION}-nix${N}"
            fi
            git commit -m "refresh per-platform node_modules hashes (${TAG}) [skip ci]"
          fi
          git tag "$TAG"
          git push origin main --tags
          echo "committed=true" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create release
        if: steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.commit.outputs.tag }}
          NEW_VERSION: ${{ needs.prepare.outputs.new-version }}
        run: |
          if [ "$TAG" = "v$NEW_VERSION" ]; then
            TITLE="pi v$NEW_VERSION"
            NOTES="Updates pi coding agent to v$NEW_VERSION"
          else
            TITLE="pi $TAG (packaging)"
            NOTES="Packaging/hash refresh release — pin with this tag for a verified build"
          fi

          gh release create "$TAG" \
            --title "$TITLE" \
            --notes "$NOTES

          \`\`\`bash
          nix flake update pi-nix  # in your dotfiles
          darwin-rebuild switch    # or home-manager switch
          \`\`\`"
