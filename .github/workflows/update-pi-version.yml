name: Update Pi with nix-update

on:
  schedule:
    # Every 6 hours
    - cron: "15 */6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Run platform hash refresh even when there is no version bump"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # Slim probe: no Nix install. Returns fast when there is nothing to do.
  check:
    runs-on: ubuntu-latest
    outputs:
      should-run: ${{ steps.decide.outputs.should-run }}
      current-version: ${{ steps.decide.outputs.current-version }}
      latest-version: ${{ steps.decide.outputs.latest-version }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: package.nix
          sparse-checkout-cone-mode: false

      - name: Compare current vs upstream version
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT=$(grep -o 'version = "[^"]*"' package.nix | head -1 | sed 's/version = "\(.*\)"/\1/')
          LATEST=$(gh api repos/earendil-works/pi/releases/latest --jq .tag_name | sed 's/^v//')
          echo "Current: $CURRENT"
          echo "Latest:  $LATEST"

          echo "current-version=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "latest-version=$LATEST" >> "$GITHUB_OUTPUT"

          if [ "$CURRENT" != "$LATEST" ] || [ "${{ inputs.force }}" = "true" ]; then
            echo "should-run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should-run=false" >> "$GITHUB_OUTPUT"
          fi

  # Bump version + src hash once, authoritatively. Per-platform node_modules
  # hashes are deferred to the matrix.
  prepare:
    needs: check
    if: needs.check.outputs.should-run == 'true'
    runs-on: ubuntu-latest
    outputs:
      version-changed: ${{ steps.bump.outputs.version-changed }}
      new-version: ${{ steps.bump.outputs.new-version }}
    steps:
      - uses: actions/checkout@v5

      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - name: Install nix-update
        run: nix profile install github:Mic92/nix-update

      - name: Bump version + src hash
        id: bump
        run: |
          # nix-update can't update per-platform outputHash maps, so it only
          # touches version + src.hash here. node_modules hashes are handled
          # by the platform-hashes matrix.
          nix-update --flake pi

          if git diff --quiet; then
            VERSION_CHANGED=false
            echo "Version unchanged (force-only run)"
          else
            VERSION_CHANGED=true
            echo "Version bumped"
          fi

          NEW_VERSION=$(grep -o 'version = "[^"]*"' package.nix | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "version-changed=$VERSION_CHANGED" >> "$GITHUB_OUTPUT"
          echo "new-version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload bumped package.nix
        uses: actions/upload-artifact@v5
        with:
          name: bumped-package-nix
          path: package.nix

  # Fan out: each platform builds on a native runner and reports its
  # node_modules hash. No sed here — the release job applies them all on
  # one runner (GNU sed), avoiding the BSD-vs-GNU divergence.
  platform-hashes:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: x86_64-linux,    runner: ubuntu-latest    }
          - { platform: aarch64-darwin,  runner: macos-latest     }
          - { platform: aarch64-linux,   runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - name: Pull bumped package.nix (overwrites checkout copy)
        uses: actions/download-artifact@v5
        with:
          name: bumped-package-nix

      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - name: Capture node_modules hash for ${{ matrix.platform }}
        run: |
          BUILD_LOG=$(nix build .#pi -L 2>&1) && BUILD_OK=true || BUILD_OK=false

          if [ "$BUILD_OK" = "true" ]; then
            echo "Build succeeded with existing hash; no update needed."
            : > hash.txt
          else
            HASH=$(echo "$BUILD_LOG" | grep "got:" | awk '{print $NF}')
            if [ -z "$HASH" ]; then
              echo "Build failed for a non-hash reason:"
              echo "$BUILD_LOG"
              exit 1
            fi
            echo "Captured ${{ matrix.platform }} hash: $HASH"
            echo "$HASH" > hash.txt
          fi

      - uses: actions/upload-artifact@v5
        with:
          name: hash-${{ matrix.platform }}
          path: hash.txt

  # Apply hashes, commit, conditionally tag + GH release.
  # Policy:
  #   - Version bump: strict. Any platform job failure fails the release.
  #   - Force-only refresh: lenient. Apply whatever hashes came back.
  release:
    needs: [check, prepare, platform-hashes]
    if: |
      always() &&
      needs.check.outputs.should-run == 'true' &&
      needs.prepare.result == 'success' &&
      (needs.platform-hashes.result == 'success' ||
       (needs.platform-hashes.result == 'failure' && needs.prepare.outputs.version-changed == 'false'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Pull bumped package.nix
        uses: actions/download-artifact@v5
        with:
          name: bumped-package-nix

      - name: Pull all platform hashes
        uses: actions/download-artifact@v5
        with:
          pattern: hash-*
          path: hashes

      - name: Apply per-platform hashes to package.nix
        run: |
          for d in hashes/hash-*; do
            platform="${d#hashes/hash-}"
            hash=$(cat "$d/hash.txt" 2>/dev/null || true)
            if [ -n "$hash" ]; then
              echo "Updating $platform = $hash"
              sed -i "s|\"$platform\" = [^;]*|\"$platform\" = \"$hash\"|" package.nix
            else
              echo "$platform: already current, skipping"
            fi
          done

      - name: Update VERSION + README badge (version bump only)
        if: needs.prepare.outputs.version-changed == 'true'
        run: |
          echo "${{ needs.prepare.outputs.new-version }}" > VERSION
          sed -i "s/pi--v[0-9]*\.[0-9]*\.[0-9]*/pi--v${{ needs.prepare.outputs.new-version }}/" README.md

      - name: Commit and push
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --staged --quiet; then
            echo "Nothing to commit (all hashes already current)"
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ needs.prepare.outputs.version-changed }}" = "true" ]; then
            git commit -m "update pi to v${{ needs.prepare.outputs.new-version }}"
            git tag "v${{ needs.prepare.outputs.new-version }}"
            git push origin main --tags
          else
            git commit -m "refresh per-platform node_modules hashes"
            git push origin main
          fi
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Create release
        if: needs.prepare.outputs.version-changed == 'true' && steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ needs.prepare.outputs.new-version }}" \
            --title "pi v${{ needs.prepare.outputs.new-version }}" \
            --notes "Updates pi coding agent to v${{ needs.prepare.outputs.new-version }}

          \`\`\`bash
          nix flake update pi-nix  # in your dotfiles
          darwin-rebuild switch    # or home-manager switch
          \`\`\`"
