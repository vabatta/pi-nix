name: Update Pi with nix-update

on:
  schedule:
    # Every 6 hours
    - cron: "15 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-pi:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Nix
        uses: cachix/install-nix-action@v24
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Install nix-update
        run: nix profile install github:Mic92/nix-update

      - name: Get current version
        id: current
        run: |
          VERSION=$(grep -o 'version = "[^"]*"' package.nix | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Update pi
        id: update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if nix-update --flake pi --build --subpackage node_modules; then
            if git diff --quiet; then
              echo "Already at latest version"
              echo "has-changes=false" >> "$GITHUB_OUTPUT"
            else
              NEW_VERSION=$(grep -o 'version = "[^"]*"' package.nix | head -1 | sed 's/version = "\(.*\)"/\1/')
              echo "Updated to $NEW_VERSION"
              echo "has-changes=true" >> "$GITHUB_OUTPUT"
              echo "new-version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "nix-update failed"
            echo "has-changes=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Update VERSION file
        if: steps.update.outputs.has-changes == 'true'
        run: echo "${{ steps.update.outputs.new-version }}" > VERSION

      - name: Update README badge
        if: steps.update.outputs.has-changes == 'true'
        run: |
          sed -i "s/pi--v[0-9]*\.[0-9]*\.[0-9]*/pi--v${{ steps.update.outputs.new-version }}/" README.md

      - name: Commit, tag, and push
        if: steps.update.outputs.has-changes == 'true'
        run: |
          git add -A
          git commit -m "update pi to v${{ steps.update.outputs.new-version }}"
          git tag "v${{ steps.update.outputs.new-version }}"
          git push origin main --tags

      - name: Create release
        if: steps.update.outputs.has-changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.update.outputs.new-version }}" \
            --title "pi v${{ steps.update.outputs.new-version }}" \
            --notes "Updates pi coding agent to v${{ steps.update.outputs.new-version }}

          Note: node_modules hash is for x86_64-linux only. Other platform hashes update on first local build.

          \`\`\`bash
          nix flake update pi-nix  # in your dotfiles
          darwin-rebuild switch    # or home-manager switch
          \`\`\`"
