name: Update Pi with nix-update

on:
  schedule:
    # Every 6 hours
    - cron: "15 */6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Run platform hash refresh even when there is no version bump"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    outputs:
      has-changes: ${{ steps.update.outputs.has-changes }}
      version-changed: ${{ steps.update.outputs.version-changed }}
      new-version: ${{ steps.update.outputs.new-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - name: Install nix-update
        run: nix profile install github:Mic92/nix-update

      - name: Bump version + fix x86_64-linux hash
        id: update
        run: |
          # nix-update handles version + src hash; per-platform node_modules
          # hashes are handled manually because nix-update can't update
          # per-platform hash maps.
          nix-update --flake pi

          BUILD_LOG=$(nix build .#pi -L 2>&1) && BUILD_OK=true || BUILD_OK=false

          if [ "$BUILD_OK" = "false" ]; then
            HASH=$(echo "$BUILD_LOG" | grep "got:" | awk '{print $NF}')
            if [ -n "$HASH" ]; then
              echo "Updating x86_64-linux node_modules hash to $HASH"
              sed -i "s|\"x86_64-linux\" = [^;]*|\"x86_64-linux\" = \"$HASH\"|" package.nix
              nix build .#pi -L
            else
              echo "Build failed but couldn't extract node_modules hash:"
              echo "$BUILD_LOG"
              exit 1
            fi
          fi

          if git diff --quiet; then
            VERSION_CHANGED=false
            echo "Already at latest version"
          else
            VERSION_CHANGED=true
            echo "Updated package.nix"
          fi

          NEW_VERSION=$(grep -o 'version = "[^"]*"' package.nix | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "version-changed=$VERSION_CHANGED" >> "$GITHUB_OUTPUT"
          echo "new-version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

          # Run downstream platform jobs whenever the version changed,
          # or when manually dispatched with force=true (refreshes stale
          # per-platform node_modules hashes without a version bump).
          if [ "$VERSION_CHANGED" = "true" ] || [ "${{ inputs.force }}" = "true" ]; then
            echo "has-changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload package.nix
        if: steps.update.outputs.has-changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: package-nix
          path: package.nix

  bump-aarch64-darwin:
    needs: bump
    if: needs.bump.outputs.has-changes == 'true'
    # macos-latest currently maps to Apple Silicon (aarch64-darwin).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: package-nix
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            experimental-features = nix-command flakes
      - name: Fix aarch64-darwin hash
        run: |
          BUILD_LOG=$(nix build .#pi -L 2>&1) && BUILD_OK=true || BUILD_OK=false
          if [ "$BUILD_OK" = "false" ]; then
            HASH=$(echo "$BUILD_LOG" | grep "got:" | awk '{print $NF}')
            if [ -n "$HASH" ]; then
              echo "Updating aarch64-darwin node_modules hash to $HASH"
              # BSD sed (macOS) needs '' after -i
              sed -i '' "s|\"aarch64-darwin\" = [^;]*|\"aarch64-darwin\" = \"$HASH\"|" package.nix
              nix build .#pi -L
            else
              echo "Build failed but couldn't extract node_modules hash:"
              echo "$BUILD_LOG"
              exit 1
            fi
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: package-nix
          path: package.nix
          overwrite: true

  bump-x86_64-darwin:
    needs: bump-aarch64-darwin
    if: needs.bump.outputs.has-changes == 'true'
    # macos-13 is the Intel Mac runner (x86_64-darwin).
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: package-nix
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            experimental-features = nix-command flakes
      - name: Fix x86_64-darwin hash
        run: |
          BUILD_LOG=$(nix build .#pi -L 2>&1) && BUILD_OK=true || BUILD_OK=false
          if [ "$BUILD_OK" = "false" ]; then
            HASH=$(echo "$BUILD_LOG" | grep "got:" | awk '{print $NF}')
            if [ -n "$HASH" ]; then
              echo "Updating x86_64-darwin node_modules hash to $HASH"
              sed -i '' "s|\"x86_64-darwin\" = [^;]*|\"x86_64-darwin\" = \"$HASH\"|" package.nix
              nix build .#pi -L
            else
              echo "Build failed but couldn't extract node_modules hash:"
              echo "$BUILD_LOG"
              exit 1
            fi
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: package-nix
          path: package.nix
          overwrite: true

  bump-aarch64-linux:
    needs: bump-x86_64-darwin
    if: needs.bump.outputs.has-changes == 'true'
    # GitHub's free ARM linux runner.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: package-nix
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            experimental-features = nix-command flakes
      - name: Fix aarch64-linux hash
        run: |
          BUILD_LOG=$(nix build .#pi -L 2>&1) && BUILD_OK=true || BUILD_OK=false
          if [ "$BUILD_OK" = "false" ]; then
            HASH=$(echo "$BUILD_LOG" | grep "got:" | awk '{print $NF}')
            if [ -n "$HASH" ]; then
              echo "Updating aarch64-linux node_modules hash to $HASH"
              sed -i "s|\"aarch64-linux\" = [^;]*|\"aarch64-linux\" = \"$HASH\"|" package.nix
              nix build .#pi -L
            else
              echo "Build failed but couldn't extract node_modules hash:"
              echo "$BUILD_LOG"
              exit 1
            fi
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: package-nix
          path: package.nix
          overwrite: true

  release:
    needs: [bump, bump-aarch64-darwin, bump-x86_64-darwin, bump-aarch64-linux]
    if: needs.bump.outputs.has-changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download finalized package.nix
        uses: actions/download-artifact@v4
        with:
          name: package-nix

      - name: Update VERSION + README badge (version bump only)
        if: needs.bump.outputs.version-changed == 'true'
        run: |
          echo "${{ needs.bump.outputs.new-version }}" > VERSION
          sed -i "s/pi--v[0-9]*\.[0-9]*\.[0-9]*/pi--v${{ needs.bump.outputs.new-version }}/" README.md

      - name: Commit and push
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --staged --quiet; then
            echo "Nothing to commit (all hashes already current)"
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ needs.bump.outputs.version-changed }}" = "true" ]; then
            git commit -m "update pi to v${{ needs.bump.outputs.new-version }}"
            git tag "v${{ needs.bump.outputs.new-version }}"
            git push origin main --tags
          else
            git commit -m "refresh per-platform node_modules hashes"
            git push origin main
          fi
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Create release
        if: needs.bump.outputs.version-changed == 'true' && steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ needs.bump.outputs.new-version }}" \
            --title "pi v${{ needs.bump.outputs.new-version }}" \
            --notes "Updates pi coding agent to v${{ needs.bump.outputs.new-version }}

          \`\`\`bash
          nix flake update pi-nix  # in your dotfiles
          darwin-rebuild switch    # or home-manager switch
          \`\`\`"
